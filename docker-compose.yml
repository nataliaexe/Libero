services:
  mcp-server:
    build: .
    container_name: libero-mcp
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - MCP_PORT=8080
      - MCP_HOST=0.0.0.0
    volumes:
      - ./cloud:/app/cloud
      - ./edge:/app/edge
    restart: unless-stopped

  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: libero-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
