<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-labelledby="title">
  <title id="title">Libero photon knot</title>
  <defs>
    <linearGradient id="tile" x1="12" y1="12" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7658B7"/>
      <stop offset="1" stop-color="#D96887"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="28" y1="31" x2="94" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".98"/>
      <stop offset=".48" stop-color="#F1E8FF" stop-opacity=".84"/>
      <stop offset="1" stop-color="#FFE2EB" stop-opacity=".98"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="104" height="104" rx="29" fill="url(#tile)"/>
  <style>
    .knot-motion { transform-box: fill-box; transform-origin: center; animation: knot-turn 42s linear infinite; }
    @keyframes knot-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .knot-motion { animation: none; } }
  </style>
  <g class="knot-motion">
  <path d="M60 21C81 20 98 36 88 51 80 63 55 68 39 83 27 94 37 105 51 101 66 97 81 80 76 66 70 50 47 34 34 43 21 52 28 70 44 72 61 74 86 59 91 43 95 31 81 20 60 21Z" stroke="#5A3D91" stroke-opacity=".34" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 21C81 20 98 36 88 51 80 63 55 68 39 83 27 94 37 105 51 101 66 97 81 80 76 66 70 50 47 34 34 43 21 52 28 70 44 72 61 74 86 59 91 43 95 31 81 20 60 21Z" stroke="url(#ribbon)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 72C58 73 79 63 89 49" stroke="#FFF" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
