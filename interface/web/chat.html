<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libero — Chat e Histórico</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #58a6ff, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .header .tagline {
    font-size: 14px;
    color: #8b949e;
    font-style: italic;
    margin-top: 4px;
  }
  .nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .nav a {
    padding: 10px 20px;
    background: #21262d;
    color: #e6edf3;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .nav a.active { background: #1f6feb; }
  .nav a:hover { opacity: 0.9; }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 700;
    color: #58a6ff;
  }
  .stat .lbl {
    font-size: 12px;
    color: #8b949e;
    margin-top: 4px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid #30363d;
  }
  .tab {
    padding: 12px 20px;
    background: transparent;
    border: none;
    color: #8b949e;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: #58a6ff;
    border-bottom-color: #58a6ff;
  }
  .tab:hover { color: #e6edf3; }
  .chat-box {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    max-height: 500px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .msg {
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 80%;
  }
  .msg.idoso {
    background: #1f6feb20;
    border-left: 3px solid #1f6feb;
    margin-right: auto;
  }
  .msg.libero {
    background: #23863620;
    border-left: 3px solid #238636;
    margin-left: auto;
  }
  .msg.emergencia {
    background: #da363320;
    border-left: 3px solid #da3633;
    margin-left: auto;
  }
  .msg.memoria {
    background: #d2992220;
    border-left: 3px solid #d29922;
    margin-left: auto;
  }
  .msg .autor {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b949e;
    margin-bottom: 6px;
  }
  .msg .texto {
    font-size: 15px;
    line-height: 1.5;
    color: #e6edf3;
  }
  .msg .hora {
    font-size: 11px;
    color: #8b949e;
    margin-top: 6px;
  }
  .input-box {
    display: flex;
    gap: 10px;
  }
  .input-box input {
    flex: 1;
    padding: 14px 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 15px;
  }
  .input-box input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  .input-box button {
    padding: 14px 24px;
    background: #238636;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-box button:hover { background: #2ea043; }
  .input-box button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #8b949e;
    font-style: italic;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    margin-left: 8px;
  }
  .badge.emergencia { background: #da3633; color: white; }
  .badge.memoria { background: #d29922; color: white; }
  .logout-btn { margin-top: 12px; padding: 8px 14px; border: 1px solid #30363d; border-radius: 8px; background: #21262d; color: #e6edf3; cursor: pointer; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>LIBERO</h1>
      <p class="tagline">Chat e Histórico · Dona Maria</p>
      <button class="logout-btn" onclick="fazerLogout()">Sair</button>
    </div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="camera.html">Câmera</a>
      <a href="chat.html" class="active">Chat</a>
      <a href="memorias.html">Memórias</a>
    </div>

    <div class="stats" id="stats">
      <div class="stat">
        <div class="num" id="stat-total">-</div>
        <div class="lbl">Mensagens</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-memorias">-</div>
        <div class="lbl">Memórias</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-emergencias">-</div>
        <div class="lbl">Emergências</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="filtrar('todas', this)">Todas</button>
      <button class="tab" onclick="filtrar('memoria', this)">Memórias</button>
      <button class="tab" onclick="filtrar('emergencia', this)">Emergências</button>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="empty">Carregando histórico...</div>
    </div>

    <div class="input-box">
      <input type="text" id="input-msg" placeholder="Digite uma mensagem para o Libero responder à Dona Maria..." onkeypress="if(event.key==='Enter') enviar()">
      <button id="btn-enviar" onclick="enviar()">Enviar</button>
    </div>
  </div>

<script>
  const API_URL = window.LIBERO_API_URL || (window.location.protocol === "file:" || ["3000", "5500"].includes(window.location.port) && ["localhost", "127.0.0.1"].includes(window.location.hostname) ? `http://${window.location.hostname || "localhost"}:8080` : window.location.origin);
  let USER = null;
  let IDOSO_ID = "";

  async function fazerLogout() {
    try {
      await fetch(`${API_URL}/auth/logout`, { method: "POST", credentials: "include" });
    } finally {
      localStorage.removeItem("libero_token");
      localStorage.removeItem("libero_user");
      window.location.href = "dashboard.html";
    }
  }

  async function verificarSessao() {
    const resp = await fetch(`${API_URL}/auth/me`, { credentials: "include" });
    if (!resp.ok) {
      window.location.href = "dashboard.html";
      return false;
    }
    const user = await resp.json();
    USER = { nome: user.nome, role: user.role, idoso_id: user.idoso_id };
    IDOSO_ID = USER.idoso_id && USER.idoso_id !== "*" ? USER.idoso_id : "dona-maria";
    localStorage.removeItem("libero_token");
    localStorage.setItem("libero_user", JSON.stringify(USER));
    return true;
  }
  
  let todasMensagens = [];
  let filtroAtual = "todas";

  function escaparHtml(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[caractere]);
  }

  async function carregar() {
    try {
      const resp = await fetch(`${API_URL}/chat/${IDOSO_ID}/mensagens?limite=100`, {
        credentials: "include"
      });
      
      if (!resp.ok) {
        document.getElementById("chat-box").innerHTML = 
          '<div class="empty">Erro ao carregar. Verifique se está logado.</div>';
        return;
      }
      
      const json = await resp.json();
      todasMensagens = json.mensagens || [];
      
      // Stats
      const stats = json.estatisticas || {};
      document.getElementById("stat-total").textContent = stats.total_mensagens || 0;
      document.getElementById("stat-memorias").textContent = stats.total_memorias || 0;
      document.getElementById("stat-emergencias").textContent = stats.total_emergencias || 0;
      
      renderizar();
    } catch (e) {
      document.getElementById("chat-box").innerHTML = 
        `<div class="empty">Erro: ${escaparHtml(e.message)}</div>`;
    }
  }

  function renderizar() {
    const box = document.getElementById("chat-box");
    
    let mensagens = todasMensagens;
    if (filtroAtual !== "todas") {
      mensagens = mensagens.filter(m => m.tipo === filtroAtual);
    }
    
    if (mensagens.length === 0) {
      box.innerHTML = '<div class="empty">Nenhuma mensagem ainda.</div>';
      return;
    }
    
    // Ordenar do mais antigo para o mais recente
    const ordenadas = [...mensagens].reverse();
    
    box.innerHTML = ordenadas.map(m => {
      const autor = m.autor === "idoso" ? "Dona Maria" : "Libero";
      const classe = m.tipo === "emergencia" ? "emergencia" :
                     m.tipo === "memoria" ? "memoria" :
                     m.autor === "idoso" ? "idoso" : "libero";
      
      let badge = "";
      if (m.tipo === "emergencia") badge = '<span class="badge emergencia">Emergência</span>';
      if (m.tipo === "memoria") badge = '<span class="badge memoria">Memória</span>';
      
      const hora = new Date(m.timestamp).toLocaleTimeString("pt-BR", {
        hour: "2-digit", minute: "2-digit"
      });
      
      return `
        <div class="msg ${classe}">
          <div class="autor">${autor}${badge}</div>
          <div class="texto">${escaparHtml(m.texto)}</div>
          <div class="hora">${hora}</div>
        </div>
      `;
    }).join("");
    
    box.scrollTop = box.scrollHeight;
  }

  function filtrar(tipo, btn) {
    filtroAtual = tipo;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    renderizar();
  }

  async function enviar() {
    const input = document.getElementById("input-msg");
    const btn = document.getElementById("btn-enviar");
    const texto = input.value.trim();
    
    if (!texto) return;
    
    btn.disabled = true;
    btn.textContent = "Enviando...";
    
    try {
      const resp = await fetch(`${API_URL}/chat/${IDOSO_ID}/mensagem`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto })
      });
      
      if (resp.ok) {
        input.value = "";
        await carregar();
      } else {
        alert("Erro ao enviar");
      }
    } catch (e) {
      alert("Erro: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Enviar";
    }
  }

  // Carregar ao iniciar
  async function iniciarPagina() {
    if (!(await verificarSessao())) return;
    await carregar();
    setInterval(carregar, 10000);
  }

  iniciarPagina();
</script>
</body>
</html>
